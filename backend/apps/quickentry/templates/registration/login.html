{% extends "quickentry/base.html" %}
{% block title %}Log in — Quick SitRep{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <h1>Quick SitRep</h1>
    <p class="subtitle">PDRRMO OPS — Bridge Reporting Tool</p>

    {% if form.non_field_errors %}
      <div class="alert alert-error">
        {% for error in form.non_field_errors %}{{ error }}{% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label>Username
        <input type="text" name="username" autofocus required autocapitalize="none">
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
